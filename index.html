<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poker di Dadi — Prototipo</title>
    <style>
      /*
        The only document-level styling in the app (everything else is inline styles on
        components), so it is deliberately minimal — five rules that cannot be expressed
        per-component.

        1. border-box everywhere: with the default content-box, any padded element given a
           percentage width overflows its container by exactly its padding + border. That is
           what made the ability cards spill out of the sidebar, and buttons were worse
           since they default to content-box regardless.
        2. No body margin: the browser's default 8px sits OUTSIDE the full-height layout and
           makes the page scroll by exactly that much.
      */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #0f172a;
        /*
          3. Stop mobile browsers inflating text on their own. When a page is laid out wider
             than the screen, iOS Safari and Android Chrome "help" by scaling font sizes up
             independently of the layout, which desynchronises every size this app computes in
             JS (see responsive.ts) from what is actually painted. We size for the viewport
             ourselves, so the automatic adjustment is only noise.
        */
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      /*
        4. The log drawer's entrance. A @keyframes cannot be written as an inline style at all,
           which is why this one rule lives here rather than on the component. Whether it RUNS is
           still decided in JS: LogDrawer omits the animation entirely when the reader has asked
           for reduced motion (see usePrefersReducedMotion), so there is no motion to override
           here and no need for a media query around it.
      */
      @keyframes drawerIn {
        from {
          transform: translateX(100%);
        }
        to {
          transform: translateX(0);
        }
      }

      /*
        5. The phase / outcome banner's entrance. Same reason as above: keyframes cannot be
           inline. Scale plus fade rather than a slide, because this one appears in the MIDDLE of
           the field — it should read as arriving toward the reader, not as passing across.
      */
      @keyframes phaseIn {
        from {
          opacity: 0;
          transform: scale(0.94);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
